{% extends "base.html" %}

{% block meta_referrer %}
<meta name="referrer" content="no-referrer">
{% endblock %}

{% block title %}Set New Password - Online Food Shop{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-200 dark:border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-slate-100 tracking-tight">Set New Password</h1>
            <p class="text-sm text-gray-600 dark:text-slate-400 mt-1">Please enter your new password below.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4" novalidate>
            {{ csrf_input() }}
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">
                    New Password <span class="text-red-600" aria-hidden="true">*</span>
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       minlength="8"
                       maxlength="128"
                       autocomplete="new-password"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-900 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-slate-500 text-gray-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                       placeholder="At least 8 characters">
                <p class="text-xs text-gray-500 dark:text-slate-400 mt-1">Must be at least 8 characters long.</p>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">
                    Confirm New Password <span class="text-red-600" aria-hidden="true">*</span>
                </label>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       required
                       minlength="8"
                       maxlength="128"
                       autocomplete="new-password"
                       class="w-full px-3 py-2 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-900 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-slate-500 text-gray-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                       placeholder="Re-enter your new password">
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-emerald-700 hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                    Reset Password
                </button>
            </div>
        </form>

        <div class="mt-6 border-t border-gray-200 dark:border-slate-700 pt-4 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-sm font-medium text-emerald-700 dark:text-emerald-400 hover:text-emerald-800 dark:hover:text-emerald-300 underline focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded">
                Back to sign in
            </a>
        </div>
    </div>
</div>
{% endblock %}
