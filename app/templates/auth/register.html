{% extends "base.html" %}

{% block title %}Create an Account - Online Food Shop{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Create an Account</h1>
            <p class="text-sm text-gray-600 mt-1">Join Online Food Shop to manage your profile</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4" novalidate>
            {{ csrf_input() }}

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    Email address <span class="text-red-600" aria-hidden="true">*</span>
                </label>
                <input type="email"
                       id="email"
                       name="email"
                       value="{{ email | default('') }}"
                       required
                       autocomplete="email"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                       placeholder="you@example.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    Password <span class="text-red-600" aria-hidden="true">*</span>
                </label>
                <input type="password"
                       id="password"
                       name="password"
                       required
                       minlength="8"
                       maxlength="128"
                       autocomplete="new-password"
                       aria-describedby="password-hint"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
                <p id="password-hint" class="text-xs text-gray-500 mt-1">Must be at least 8 characters.</p>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">
                    Confirm password <span class="text-red-600" aria-hidden="true">*</span>
                </label>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       required
                       minlength="8"
                       maxlength="128"
                       autocomplete="new-password"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
            </div>

            <div class="pt-2">
                <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-emerald-700 hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
                    Create Account
                </button>
            </div>
        </form>

        <div class="mt-6 border-t border-gray-200 pt-4 text-center">
            <p class="text-sm text-gray-600">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="font-medium text-emerald-700 hover:text-emerald-800 underline focus:outline-none focus:ring-2 focus:ring-emerald-500 rounded">
                    Sign in here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
