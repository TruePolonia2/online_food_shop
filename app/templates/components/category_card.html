{# Reusable Category Pill Navigation Component #}
{% macro all_categories_pill(is_selected=False) %}
<a href="{{ url_for('catalog.index') }}"
   class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 {% if is_selected %}bg-emerald-700 text-white dark:bg-emerald-600 shadow-xs ring-2 ring-emerald-700/20 dark:ring-emerald-500/30 border border-emerald-700{% else %}bg-white dark:bg-slate-800 text-stone-700 dark:text-slate-200 hover:bg-emerald-50/50 dark:hover:bg-slate-700 hover:text-emerald-700 dark:hover:text-emerald-400 border border-stone-200 dark:border-slate-700{% endif %}">
    <span>{{ _('All Categories') }}</span>
</a>
{% endmacro %}

{% macro category_pill(category, is_selected=False) %}
<a href="{{ url_for('catalog.index', category_id=category.id) }}"
   class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-semibold transition-all focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2 {% if is_selected %}bg-orange-600 text-white dark:bg-orange-600 shadow-xs ring-2 ring-orange-600/20 dark:ring-orange-500/30 border border-orange-600{% else %}bg-white dark:bg-slate-800 text-stone-700 dark:text-slate-200 hover:bg-orange-50/60 dark:hover:bg-slate-700 hover:text-orange-600 dark:hover:text-orange-400 border border-stone-200 dark:border-slate-700{% endif %}">
    <span>{{ category.name }}</span>
</a>
{% endmacro %}
