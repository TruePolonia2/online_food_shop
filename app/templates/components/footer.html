<!-- Footer -->
<footer class="bg-white dark:bg-slate-900 border-t border-stone-200/90 dark:border-slate-800 mt-auto transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-6">
            <!-- Brand & Tagline -->
            <div class="flex flex-col sm:flex-row items-center gap-3 text-center sm:text-left">
                {% include "components/brand_logo.html" %}
                <span class="hidden sm:inline text-stone-300 dark:text-slate-700">|</span>
                <span class="text-xs text-stone-500 dark:text-slate-400">{{ _('Fresh organic food & artisan groceries') }}</span>
            </div>

            <!-- Quick Links -->
            <div class="flex items-center gap-6 text-sm font-medium text-stone-600 dark:text-slate-400">
                <a href="{{ url_for('catalog.index') }}" class="hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors">{{ _('Products') }}</a>
                <a href="{{ url_for('contact.contact') }}" class="hover:text-emerald-700 dark:hover:text-emerald-400 transition-colors">{{ _('Contact Us') }}</a>
            </div>
        </div>

        <div class="mt-6 pt-6 border-t border-stone-100 dark:border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-stone-500 dark:text-slate-400">
            <p>&copy; {{ current_year | default(2026) }} Online Food Shop. {{ _('All rights reserved.') }}</p>
            <div class="flex items-center gap-2 text-stone-400 dark:text-slate-500">
                <span>{{ _('Secure payment powered by Stripe (Test Mode)') }}</span>
            </div>
        </div>
    </div>
</footer>
